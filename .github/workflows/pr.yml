# CI untuk PR (docs/design/28-cicd.md). Diport dari LedgerPay (skeleton 0.0.1): lint, unit, integration,
# migration, lint workflow/OpenAPI/shell, security. Deploy (main.yml, rollback.yml) menyusul Sprint 8.
# Semua action di-pin ke commit SHA (C-27); komentar menunjukkan tag aslinya.
name: pr

on:
  pull_request:
  workflow_call: # main.yml (Sprint 8) memanggil workflow ini sebagai gate "verify" sebelum build + deploy


permissions:
  contents: read

concurrency:
  # Saat dipanggil main.yml, github.workflow = "main" → grup berbeda dari grup deploy pemanggil.
  group: ${{ github.workflow }}-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: golangci-lint (gosec, depguard, ...)
        working-directory: backend
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: Generated code is up to date (oapi-codegen + sqlc)
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          PATH="$(go env GOPATH)/bin:$PATH" make gen-check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
      - name: Unit tests (race detector, no Docker)
        working-directory: backend
        run: go test -race -short ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
      - name: Integration tests (Postgres via testcontainers, race detector)
        working-directory: backend
        run: go test -race -count=1 -tags testhooks ./internal/...

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
      - name: Migrations up-from-zero + catalogue checks
        working-directory: backend
        run: go test -race -count=1 ./db/...

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  lint-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck
        run: make lint-shell

  # Alert rules = kode (DoD O4): promtool check + unit test (termasuk A-13 isolation violation sintetis).
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: promtool
        run: make test-alerts

  # Dependency dengan CVE yang terpanggil dan secret di SELURUH history gagal di PR (sejak Sprint 0).
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks memindai semua commit, bukan hanya diff
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
      - name: govulncheck (hanya kerentanan yang benar-benar terpanggil)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: gitleaks (seluruh history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --log-opts=--all --redact --config /repo/.gitleaks.toml
      - name: trivy fs (vuln + misconfig; gagal CRITICAL/HIGH yang punya fix)
        run: make trivy-fs

  lint-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Redocly lint
        working-directory: backend
        run: npx --yes @redocly/cli@1 lint api/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Typecheck, unit test, build
        run: |
          yarn typecheck
          yarn test:unit
          yarn build
