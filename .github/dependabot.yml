# Dependency di-pin; pembaruannya datang sebagai PR yang melewati semua gate CI.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
