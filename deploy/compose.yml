# Compose untuk development lokal (Sprint 0; worker sejak Sprint 4). Compose demo/obs/perf menyusul (docs/design/27-docker-compose.md).
# Kredensial di file ini HANYA untuk dev lokal; environment lain memakai secret (desain DevOps).
# Port default dipilih supaya bisa berjalan BERSAMAAN dengan stack LedgerPay (55432, 8080/9090).
name: payrun

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payrun
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-dev
      PAYRUN_OWNER_PASSWORD: owner-dev
      PAYRUN_APP_PASSWORD: app-dev
      PAYRUN_READONLY_PASSWORD: readonly-dev
      PAYRUN_BACKUP_PASSWORD: backup-dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PR_PG_PORT:-55433}:5432"     # hanya localhost (untuk psql dev); tidak pernah 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payrun"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile, target: payrun }
    command: ["migrate", "up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://payrun_owner:owner-dev@postgres:5432/payrun?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: .., dockerfile: deploy/Dockerfile, target: payrun }
    command: ["api"]
    environment:
      APP_ENV: dev
      LOG_LEVEL: info
      # payrun_app: NOBYPASSRLS dan bukan owner. Api menolak start kalau DSN ini diganti owner (CheckAppRole).
      DATABASE_URL: postgres://payrun_app:app-dev@postgres:5432/payrun?sslmode=disable
      # Kunci dev saja (32 byte, base64). Production: secret environment (final review R4-7).
      JWT_SIGNING_KEYS: '{"dev1":"cGF5cnVuLWRldi1vbmx5LWp3dC1zaWduaW5nLWtleSE="}'
      JWT_ACTIVE_KID: dev1
      COOKIE_SECURE: "false"       # dev lokal lewat http://localhost
      # Origin SPA dev (frontend/, `yarn dev`): PR_WEB_PORT harus sama di sini dan saat menjalankan Vite.
      ALLOWED_ORIGINS: http://localhost:${PR_WEB_PORT:-5174}
      PUBLIC_BASE_URL: http://localhost:${PR_WEB_PORT:-5174}
      PII_KEYRING: '{"v1":"cGF5cnVuLWRldi1vbmx5LXBpaS1rZXktMzItYnl0ZXM="}'   # dev saja (32 byte)
      PII_ACTIVE_KEY_VERSION: v1
      PII_BLIND_INDEX_KEY: cGF5cnVuLWRldi1vbmx5LWJsaW5kLWluZGV4LWtleSE=   # dev saja (32 byte)
      S3_ENDPOINT: http://storage:8333
      # Host di URL presigned unduhan payslip: yang dijangkau browser (produksi: files.<domain> lewat Caddy).
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:${PR_S3_PORT:-8333}
      S3_BUCKET: payrun-private
      S3_ACCESS_KEY: payrun-dev-access
      S3_SECRET_KEY: payrun-dev-secret-only-for-local
      OTEL_EXPORTER_OTLP_ENDPOINT: ${PR_OTLP_ENDPOINT:-}
      SMTP_ADDR: mailpit:1025          # Mailpit menangkap semua email dev (UI: http://127.0.0.1:8025)
      MAIL_FROM: "PayRun Dev <no-reply@payrun.local>"
    ports:
      - "127.0.0.1:${PR_HTTP_PORT:-8081}:8080"   # API
      - "127.0.0.1:${PR_OPS_PORT:-9190}:9090"    # ops (health/metrics) — di demo/prod tidak dipublish
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Job runner (Sprint 4): kalkulasi payroll async (payroll.plan → payroll.calc_chunk) + maintenance.
  # Tanpa port API; ops (health/metrics) hanya localhost di dev.
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile, target: payrun }
    command: ["worker"]
    environment:
      APP_ENV: dev
      LOG_LEVEL: info
      DATABASE_URL: postgres://payrun_app:app-dev@postgres:5432/payrun?sslmode=disable
      PII_KEYRING: '{"v1":"cGF5cnVuLWRldi1vbmx5LXBpaS1rZXktMzItYnl0ZXM="}'   # dev saja, sama dengan api
      PII_ACTIVE_KEY_VERSION: v1
      PII_BLIND_INDEX_KEY: cGF5cnVuLWRldi1vbmx5LWJsaW5kLWluZGV4LWtleSE=
      PAYROLL_CHUNK_SIZE: ${PR_PAYROLL_CHUNK_SIZE:-50}
      PR_PAYROLL_CALC_ENABLED: ${PR_PAYROLL_CALC_ENABLED:-true}   # kill switch (29-deploy §4.3)
      PR_PAYSLIP_RENDER_ENABLED: ${PR_PAYSLIP_RENDER_ENABLED:-true}   # kill switch lane documents
      # Lane documents (payslip.render, S7): PUT PDF ke bucket private (ADR-012).
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: payrun-private
      S3_ACCESS_KEY: payrun-dev-access
      S3_SECRET_KEY: payrun-dev-secret-only-for-local
      OTEL_EXPORTER_OTLP_ENDPOINT: ${PR_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${PR_WORKER_OPS_PORT:-9191}:9090"   # ops worker — di demo/prod tidak dipublish
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s   # job in-flight diberi waktu selesai (27-docker-compose §5)
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # ---------------------------------------------------------------- email (dev): Mailpit
  # Menangkap semua email (verifikasi, undangan); tidak ada yang keluar ke internet (final review R2-8).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${PR_MAILPIT_UI_PORT:-8025}:8025"   # UI web
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------- object storage (profile storage)
  # S3-compatible untuk payslip PDF (Sprint 7, ADR-012). SeaweedFS menggantikan MinIO: image MinIO
  # komunitas tidak lagi bisa di-pull (diverifikasi Sprint 0, lihat docs/adr/ADR-012-object-storage.md, Amandemen Sprint 0).
  # Bucket private: tidak ada identitas anonim di s3.json, jadi request tanpa tanda tangan ditolak.
  storage:
    image: chrislusf/seaweedfs:3.97
    profiles: [storage]
    # Slot volume cukup untuk collection default + satu collection per bucket (5 slot habis → "Not enough
    # data nodes found", PUT payslip 500); volume 128 MB supaya 20 slot tidak memesan 20 GB.
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=128", "-volume.max=20"]
    volumes:
      - s3data:/data
      - ./storage/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:${PR_S3_PORT:-8333}:8333"
    healthcheck:
      # Master (9333) DAN gateway S3 (8333): gateway naik belakangan, jadi cek master saja membuat
      # "healthy" sebelum S3 bisa dipakai. S3 tanpa tanda tangan menjawab 403 (wget exit ≠ 0), jadi
      # yang dicek adalah adanya respons HTTP, bukan statusnya.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: buat bucket payrun-private (idempoten). Pengganti `minio-init` di `27-docker-compose.md`.
  storage-init:
    image: chrislusf/seaweedfs:3.97
    profiles: [storage]
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if echo "s3.bucket.list" | weed shell -master=storage:9333 | grep -q "payrun-private"; then
          echo "bucket payrun-private already exists"
        else
          echo "s3.bucket.create -name payrun-private" | weed shell -master=storage:9333
          echo "bucket payrun-private created"
        fi
    depends_on:
      storage: { condition: service_healthy }
    restart: "no"

  # ---------------------------------------------------------------- observability (profile obs / obs-full)
  # final review R4-6: V1 `obs` = Prometheus + Grafana (ringan untuk VM kecil). Jaeger di `obs-full` (R4-16).
  # `make up-obs`. Port berbeda dari LedgerPay supaya kedua stack bisa jalan bersamaan.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [obs, obs-full]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports: ["127.0.0.1:${PR_PROM_PORT:-9098}:9090"]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [obs, obs-full]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"     # dev lokal saja; deploy publik memakai login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin-dev
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${PR_GRAFANA_PORT:-3001}:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: [obs-full]
    ports: ["127.0.0.1:${PR_JAEGER_PORT:-16687}:16686"]   # UI; OTLP 4318 hanya di jaringan compose

volumes:
  pgdata:
  s3data:
