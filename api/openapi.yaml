openapi: 3.1.0
info:
  title: PayRun API
  version: 0.1.0
  summary: Multi-tenant workforce and payroll platform.
  description: |
    Spec-first contract (ADR-003). Sprint 0 skeleton: every P0/P1 endpoint from
    docs/design/16-api-endpoints.md §2 with roles, idempotency, and rate tier, but request and
    response bodies are placeholders. Each body is filled in by the sprint that builds the feature,
    together with its contract test.

    - **Tenant comes only from the `tid` claim** of the access token, never from path, header,
      query, or body (ADR-P02). Paths therefore have no `/tenants/{id}` prefix, and a body field
      `tenant_id` is rejected as an unknown field. A token without `tid` on a tenant endpoint → 403.
    - Another tenant's resource id → **404**, the same as a missing resource (no existence oracle).
    - Money is a **string** decimal with 2 digits (`"6888609.00"`), never a JSON number (ADR-P06).
    - Errors use RFC 9457 `application/problem+json` with a stable `code` (docs/design/15-api-error-catalogue.md).
    - `x-roles`, `x-feature`, `x-rate-tier`, `x-priority` document the authorization matrix
      (docs/design/17-api-authorization-matrix.md); the matrix test in Sprint 2 reads them.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Relative to the host serving the SPA (Caddy routes /api/* to the API)

tags:
  - name: auth
    description: "Login, refresh, and tenant selection (ADR-009, ADR-P02). Platform scope: no tid required."
  - name: tenancy
    description: Tenant signup, settings, and holiday calendar (PF-01, PF-08).
  - name: members
    description: Memberships, roles, and invitations (PF-02).
  - name: org
    description: Departments and positions (PF-05).
  - name: employees
    description: Employees and their PII, masked by default (PF-06, PF-20).
  - name: compensation
    description: Effective-dated salary and pay components (PF-07, ADR-P04).
  - name: attendance
    description: Clock in/out, HR corrections, CSV import (PF-08, PF-21).
  - name: leave
    description: Leave types, balances, and requests (PF-09).
  - name: overtime
    description: Overtime requests (PF-10).
  - name: approvals
    description: One approval engine for leave, overtime, and payroll runs (PF-11, ADR-P09).
  - name: payroll
    description: "Payroll periods and runs: calculate, review, submit, finalize (PF-12…PF-14)."
  - name: adjustments
    description: Post-final corrections (PF-19).
  - name: payslips
    description: Payslips for employees and payroll staff (PF-15, PF-22).
  - name: audit
    description: Audit log (PF-16).

security:
  - tenantJWT: []

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in; tid only if the user has exactly one active tenant
      description: |
        Unknown email, wrong password, inactive and locked accounts all answer the same
        `401 INVALID_CREDENTIALS` (no Retry-After; Step 12 R2-5). Sets the refresh cookie.
      x-endpoint: A1
      x-feature: PF-02
      x-roles: "public"
      x-rate-tier: auth-strict
      x-priority: P0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK. Refresh token in the `pr_refresh` cookie (HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        `X-Active-Tenant` keeps `tid` only while the membership is still ACTIVE; roles are re-read
        from the database. A revoked membership answers 200 with `active_tenant: null` (ADR-P02).
        A second refresh with the same cookie within 10 s gets an access token without a new cookie.
      x-endpoint: A2
      x-feature: PF-02
      x-roles: "cookie"
      x-rate-tier: auth-strict
      x-priority: P0
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
        - name: X-Active-Tenant
          in: header
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK. Cookie rotated (except inside the grace window).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the refresh token family (always 204)
      x-endpoint: A3
      x-feature: PF-02
      x-roles: "cookie"
      x-rate-tier: auth-ip
      x-priority: P0
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          description: Done; the cookie is cleared.
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Verify the email with the one-time link token; activates the user's pending tenants
      x-endpoint: A7
      x-feature: PF-02
      x-roles: "public"
      x-rate-tier: auth-strict
      x-priority: P0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailRequest' }
      responses:
        '204':
          description: Verified. Tenants in PENDING_VERIFICATION owned by the user are now ACTIVE.
        '400': { $ref: '#/components/responses/ValidationError' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Send a new verification link (previous links stop working); no-op when already verified
      x-endpoint: A8
      x-feature: PF-02
      x-roles: "user"
      x-rate-tier: auth-strict
      x-priority: P0
      security:
        - userJWT: []
      responses:
        '204':
          description: Sent (or already verified).
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user; active_tenant re-read from the database
      x-endpoint: A4
      x-feature: PF-02
      x-roles: "user"
      x-rate-tier: read
      x-priority: P0
      security:
        - userJWT: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me/memberships:
    get:
      tags: [auth]
      operationId: listMyMemberships
      summary: Active tenants the user belongs to, with roles (max 100, no pagination)
      x-endpoint: A5
      x-feature: PF-02
      x-roles: "user"
      x-rate-tier: read
      x-priority: P0
      security:
        - userJWT: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /session/switch-tenant:
    post:
      tags: [auth]
      operationId: switchTenant
      summary: Issue an access token for one tenant (tid claim) after checking the membership
      description: Not a member, revoked membership and unknown tenant are the same 404. Suspended or pending-verification tenant → 403.
      x-endpoint: A6
      x-feature: PF-02
      x-roles: "user + active membership"
      x-rate-tier: write
      x-priority: P0
      security:
        - userJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchTenantRequest' }
      responses:
        '200':
          description: OK. The refresh token is unchanged (not bound to a tenant).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /tenants/signup:
    post:
      tags: [tenancy]
      operationId: signupTenant
      summary: Create tenant + user (if new) + OWNER membership + default settings in one transaction
      description: |
        A new email gets a PENDING_VERIFICATION tenant and a verification email (R2-8); an existing,
        verified account (password must match) gets an ACTIVE tenant selected as `active_tenant`.
        A retry with the same `Idempotency-Key` and payload replays `SignupReplay` (no tokens) with
        `Idempotent-Replayed: true`. The password is not part of the request hash.
      x-endpoint: T1
      x-feature: PF-01
      x-roles: "public"
      x-rate-tier: auth-strict
      x-priority: P0
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Created (or replayed). Sets the refresh cookie on the first response only.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SignupResult'
                  - $ref: '#/components/schemas/SignupReplay'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /tenant:
    get:
      tags: [tenancy]
      operationId: getTenant
      summary: Current tenant (from the tid claim) and its settings
      x-endpoint: T2
      x-feature: PF-01
      x-roles: "all roles"
      x-rate-tier: read
      x-priority: P0
      responses:
        '200':
          description: OK. `ETag` = settings version (for `If-Match` on PATCH /tenant/settings).
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /tenant/settings:
    patch:
      tags: [tenancy]
      operationId: updateTenantSettings
      summary: Update tenant settings (cut-off, proration, rounding)
      x-endpoint: T3
      x-feature: PF-01
      x-roles: "O"
      x-rate-tier: write
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pending' }
      responses:
        '200':
          description: OK. Body model `Tenant` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /holidays:
    get:
      tags: [tenancy]
      operationId: listHolidays
      summary: Tenant holiday calendar
      x-endpoint: T4
      x-feature: PF-08
      x-roles: "all roles"
      x-rate-tier: read
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK. Body model `HolidayList` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [tenancy]
      operationId: createHoliday
      summary: Add a holiday (unique per date)
      x-endpoint: T5
      x-feature: PF-08
      x-roles: "O, H"
      x-rate-tier: write
      x-priority: P1
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pending' }
      responses:
        '201':
          description: Created. Body model `Holiday` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /holidays/{id}:
    delete:
      tags: [tenancy]
      operationId: deleteHoliday
      summary: Remove a holiday (PERIOD_LOCKED if the period is final)
      x-endpoint: T6
      x-feature: PF-08
      x-roles: "O, H"
      x-rate-tier: write
      x-priority: P1
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Done.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: Members and roles of the tenant
      x-endpoint: U1
      x-feature: PF-02
      x-roles: "O, H"
      x-rate-tier: read
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK. Body model `MemberList` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invitations:
    post:
      tags: [members]
      operationId: createInvitation
      summary: Invite a user by email (single use, 7 days)
      x-endpoint: U2
      x-feature: PF-02
      x-roles: "O, H"
      x-rate-tier: write
      x-priority: P0
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pending' }
      responses:
        '201':
          description: Created. Body model `Invitation` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /invitations/accept:
    post:
      tags: [members]
      operationId: acceptInvitation
      summary: Accept an invitation with the secret from the link
      x-endpoint: U3
      x-feature: PF-02
      x-roles: "user (email must match)"
      x-rate-tier: auth-ip
      x-priority: P0
      security:
        - userJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pending' }
      responses:
        '200':
          description: OK. Body model `Membership` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /members/{id}/roles:
    patch:
      tags: [members]
      operationId: updateMemberRoles
      summary: Change roles (LAST_OWNER guard)
      x-endpoint: U4
      x-feature: PF-02
      x-roles: "O (H limited)"
      x-rate-tier: write
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pending' }
      responses:
        '200':
          description: OK. Body model `Membership` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /members/{id}/revoke:
    post:
      tags: [members]
      operationId: revokeMember
      summary: Revoke a membership (LAST_OWNER guard)
      x-endpoint: U5
      x-feature: PF-02
      x-roles: "O (H limited)"
      x-rate-tier: write
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pending' }
      responses:
        '200':
          description: OK. Body model `Membership` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /departments:
    get:
      tags: [org]
      operationId: listDepartments
      summary: Departments
      x-endpoint: G1a
      x-feature: PF-05
      x-roles: "all roles"
      x-rate-tier: read
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK. Body model `DepartmentList` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [org]
      operationId: createDepartment
      summary: Create a department (unique code)
      x-endpoint: G2a
      x-feature: PF-05
      x-roles: "O, H"
      x-rate-tier: write
      x-priority: P0
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pending' }
      responses:
        '201':
          description: Created. Body model `Department` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /departments/{id}:
    patch:
      tags: [org]
      operationId: updateDepartment
      summary: Update a department
      x-endpoint: G3a
      x-feature: PF-05
      x-roles: "O, H"
      x-rate-tier: write
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pending' }
      responses:
        '200':
          description: OK. Body model `Department` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /departments/{id}/deactivate:
    post:
      tags: [org]
      operationId: deactivateDepartment
      summary: Deactivate a department
      x-endpoint: G4a
      x-feature: PF-05
      x-roles: "O, H"
      x-rate-tier: write
      x-priority: P0
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pending' }
      responses:
        '200':
          description: OK. Body model `Department` (docs/design/16-api-endpoints.md §16).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pending' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }
