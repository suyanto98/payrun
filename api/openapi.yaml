components:
  securitySchemes:
    tenantJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (15 minutes) WITH a `tid` claim, issued by POST /session/switch-tenant after checking an ACTIVE membership.
    userJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token with or without `tid` (platform-scope endpoints).
    refreshCookie:
      type: apiKey
      in: cookie
      name: pr_refresh
      description: Opaque refresh token, rotated on every use with reuse detection.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Client-generated key; same key + same payload = same result. Scoped per tenant (signup: platform scope)."
      schema: { type: string, minLength: 8, maxLength: 255, pattern: '^[A-Za-z0-9_\-:.]{8,255}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Optimistic concurrency. The resource `version` from its ETag (e.g. `"3"`); missing → 428 PRECONDITION_REQUIRED, stale → 412 VERSION_CONFLICT.
      schema: { type: string }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF guard for cookie-authenticated endpoints. Must be `fetch`.
      schema: { type: string, enum: [fetch] }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `page.next_cursor`.
      schema: { type: string }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Pending:
      type: object
      description: Placeholder until the feature sprint defines the body (Sprint 0 skeleton).
    Money:
      type: string
      description: Decimal amount with exactly 2 fraction digits, as a string (no floats). IDR. Negative only where documented (adjustments).
      pattern: '^-?[0-9]{1,16}\.[0-9]{2}$'
      examples: ['6888609.00']
    Rate:
      type: string
      description: Decimal rate with 6 fraction digits, as a string (e.g. BPJS 2% = "0.020000").
      pattern: '^[0-9]{1,4}\.[0-9]{6}$'
      examples: ['0.020000']
    Period:
      type: string
      description: Payroll period, calendar month in the tenant timezone.
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-03']
    Page:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    User:
      type: object
      required: [id, email, display_name, email_verified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        email_verified: { type: boolean }
    ActiveTenant:
      type: object
      required: [id, name, roles]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    Role:
      type: string
      enum: [OWNER, HR_ADMIN, PAYROLL_ADMIN, MANAGER, EMPLOYEE]
    Session:
      type: object
      required: [access_token, token_type, expires_in, active_tenant]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds }
        user: { $ref: '#/components/schemas/User' }
        active_tenant:
          oneOf:
            - $ref: '#/components/schemas/ActiveTenant'
            - type: 'null'
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [active_tenant, employee_id]
          properties:
            active_tenant:
              oneOf:
                - $ref: '#/components/schemas/ActiveTenant'
                - type: 'null'
            employee_id: { type: [string, 'null'], format: uuid, description: Filled from Sprint 2 (employees). }
    MembershipList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            type: object
            required: [tenant_id, tenant_name, roles, status]
            properties:
              tenant_id: { type: string, format: uuid }
              tenant_name: { type: string }
              roles:
                type: array
                items: { $ref: '#/components/schemas/Role' }
              status: { type: string, enum: [ACTIVE] }
    SwitchTenantRequest:
      type: object
      additionalProperties: false
      required: [tenant_id]
      properties:
        tenant_id: { type: string, format: uuid }
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 128 }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [company_name, slug, owner]
      properties:
        company_name: { type: string, minLength: 2, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9](-?[a-z0-9]){2,39}$' }
        timezone: { type: string, description: IANA name; default Asia/Jakarta, examples: [Asia/Jakarta] }
        owner:
          type: object
          additionalProperties: false
          required: [email, password, display_name]
          properties:
            email: { type: string, format: email, maxLength: 254 }
            password: { type: string, minLength: 10, maxLength: 128 }
            display_name: { type: string, minLength: 1, maxLength: 80 }
    TenantSummary:
      type: object
      required: [id, name, slug, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED] }
    SignupReplay:
      type: object
      required: [tenant, email_verification_required]
      properties:
        tenant: { $ref: '#/components/schemas/TenantSummary' }
        email_verification_required: { type: boolean }
    SignupResult:
      allOf:
        - $ref: '#/components/schemas/Session'
        - $ref: '#/components/schemas/SignupReplay'
    TenantSettings:
      type: object
      required: [timezone, work_days, proration_basis, cutoff_day_of_next_month, cutoff_time_local, overtime_basis,
                 overtime_max_hours_per_day, incomplete_attendance_policy, ruleset_code, net_change_warning_pct]
      properties:
        timezone: { type: string }
        work_days:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        proration_basis: { type: string, enum: [WORKING_DAYS, CALENDAR_DAYS] }
        cutoff_day_of_next_month: { type: integer, minimum: 1, maximum: 28 }
        cutoff_time_local: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        overtime_basis: { type: string, enum: [BASE, BASE_PLUS_FIXED] }
        overtime_max_hours_per_day: { type: [string, 'null'], description: Decimal string; null = no limit }
        incomplete_attendance_policy: { type: string, enum: [COUNT_AS_PRESENT, COUNT_AS_ABSENT] }
        ruleset_code: { type: string }
        net_change_warning_pct: { type: string, description: Decimal string }
    Tenant:
      type: object
      required: [id, name, slug, status, settings, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED] }
        settings: { $ref: '#/components/schemas/TenantSettings' }
        version: { type: integer }
    OrgUnit:
      type: object
      required: [id, code, name, status, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z0-9_]{1,20}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, format: int32 }
    OrgUnitList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/OrgUnit' }
    OrgUnitCreate:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{1,20}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
    OrgUnitUpdate:
      type: object
      additionalProperties: false
      required: [name]
      description: "`code` is immutable."
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    Empty:
      type: object
      additionalProperties: false
    Bank:
      type: object
      required: [name, account_masked, holder]
      properties:
        name: { type: [string, 'null'] }
        account_masked: { type: [string, 'null'], examples: ['******7890'] }
        holder: { type: [string, 'null'] }
    Employee:
      type: object
      description: |
        PII is always masked here (full view: GET /employees/{id}/pii, Sprint 4). MANAGER and EMPLOYEE
        receive the basic version without `ptkp_status`, `nik_masked`, `npwp_masked` and `bank`.
        `current_org` is the placement in force today (department/position effective-dated) plus the
        current manager (not effective-dated, amendment S14); null when neither exists.
      required: [id, employee_no, full_name, work_email, status, hire_date, end_date, current_org, user_id, version]
      properties:
        id: { type: string, format: uuid }
        employee_no: { type: string }
        full_name: { type: string }
        work_email: { type: [string, 'null'], format: email }
        status: { type: string, enum: [ACTIVE, RESIGNED, TERMINATED] }
        hire_date: { type: string, format: date }
        end_date: { type: [string, 'null'], format: date, description: Last working day (inclusive). }
        current_org:
          oneOf:
            - $ref: '#/components/schemas/CurrentOrg'
            - type: 'null'
        user_id: { type: [string, 'null'], format: uuid }
        version: { type: integer, format: int32 }
        ptkp_status: { type: string, enum: [TK/0, TK/1, TK/2, TK/3, K/0, K/1, K/2, K/3] }
        nik_masked: { type: [string, 'null'], examples: ['************0001'] }
        npwp_masked: { type: [string, 'null'], examples: ['***********1234'] }
        bank:
          oneOf:
            - $ref: '#/components/schemas/Bank'
            - type: 'null'
    EmployeeListItem:
      type: object
      required: [id, employee_no, full_name, status, department, position, hire_date]
      properties:
        id: { type: string, format: uuid }
        employee_no: { type: string }
        full_name: { type: string }
        status: { type: string, enum: [ACTIVE, RESIGNED, TERMINATED] }
        department:
          oneOf:
            - $ref: '#/components/schemas/Ref'
            - type: 'null'
        position:
          oneOf:
            - $ref: '#/components/schemas/Ref'
            - type: 'null'
        hire_date: { type: string, format: date }
    EmployeeList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/EmployeeListItem' }
        page: { $ref: '#/components/schemas/Page' }
    BankInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        account_number: { type: string, description: '6–20 digits; spaces, dots and dashes are ignored.' }
        holder: { type: string, minLength: 1, maxLength: 120 }
    EmployeeCreate:
      type: object
      additionalProperties: false
      description: "`org` and `salary` start at hire_date, in the same transaction as the employee."
      required: [employee_no, full_name, hire_date]
      properties:
        org: { $ref: '#/components/schemas/OrgInput' }
        salary:
          type: object
          additionalProperties: false
          required: [base_salary]
          properties:
            base_salary: { $ref: '#/components/schemas/Money' }
        employee_no: { type: string, pattern: '^[A-Za-z0-9-]{1,30}$' }
        full_name: { type: string, minLength: 1, maxLength: 120 }
        work_email: { type: string, format: email }
        hire_date: { type: string, format: date, description: At most 90 days ahead. }
        ptkp_status: { type: string, enum: [TK/0, TK/1, TK/2, TK/3, K/0, K/1, K/2, K/3], default: TK/0 }
        nik: { type: string, description: 16 digits. Encrypted at rest; unique per tenant (NIK_TAKEN). }
        npwp: { type: string, description: 15–16 digits. Encrypted at rest; unique per tenant (NPWP_TAKEN). }
        bank: { $ref: '#/components/schemas/BankInput' }
    EmployeeUpdate:
      type: object
      additionalProperties: false
      description: "Partial update; `employee_no`, `hire_date` and status cannot be changed here."
      properties:
        full_name: { type: string, minLength: 1, maxLength: 120 }
        work_email: { type: string, format: email }
        ptkp_status: { type: string, enum: [TK/0, TK/1, TK/2, TK/3, K/0, K/1, K/2, K/3] }
        nik: { type: string }
        npwp: { type: string }
        bank: { $ref: '#/components/schemas/BankInput' }
    TerminateRequest:
      type: object
      additionalProperties: false
      required: [type, end_date]
      properties:
        type: { type: string, enum: [RESIGNED, TERMINATED] }
        end_date: { type: string, format: date, description: Last working day (inclusive); not before hire_date. }
        reason: { type: string, maxLength: 500 }
    MemberUser:
      type: object
      required: [id, email, display_name]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
    Member:
      type: object
      required: [id, user, invited_email, roles, status, accepted_at, version]
      properties:
        id: { type: string, format: uuid }
        user:
          oneOf:
            - $ref: '#/components/schemas/MemberUser'
            - type: 'null'
        invited_email: { type: [string, 'null'], format: email }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [INVITED, ACTIVE, REVOKED] }
        accepted_at: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int32 }
    MemberList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Member' }
        page: { $ref: '#/components/schemas/Page' }
    MemberRolesRequest:
      type: object
      additionalProperties: false
      description: Absolute set of roles. HR_ADMIN may only set MANAGER/EMPLOYEE on members without admin roles.
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: '#/components/schemas/Role' }
    RevokeMemberRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 200 }
    EmployeePII:
      type: object
      description: Full values (W6). Fields never set are null. PAYROLL_ADMIN and MANAGER (on direct reports) get 403.
      required: [nik, npwp, bank]
      properties:
        nik: { type: [string, 'null'], pattern: '^[0-9]{16}$' }
        npwp: { type: [string, 'null'], pattern: '^[0-9]{15,16}$' }
        bank:
          oneOf:
            - type: object
              required: [name, account_number, holder]
              properties:
                name: { type: [string, 'null'] }
                account_number: { type: [string, 'null'], pattern: '^[0-9]{6,20}$' }
                holder: { type: [string, 'null'] }
            - type: 'null'
    InvitationRequest:
      type: object
      additionalProperties: false
      required: [email, roles]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        roles:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Role' }
        employee_id: { type: string, format: uuid, description: Links the user to this employee on accept. }
    Invitation:
      type: object
      required: [membership_id, status, invite_url, expires_at]
      properties:
        membership_id: { type: string, format: uuid }
        status: { type: string, enum: [INVITED] }
        invite_url: { type: string, description: 'Shown once; contains the secret in the fragment (`/invite#<tenant_id>.<secret>`).' }
        expires_at: { type: string, format: date-time }
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 128, description: '`<tenant_id>.<secret>` from the invite link fragment.' }
    AcceptedInvitation:
      type: object
      required: [membership]
      properties:
        membership:
          type: object
          required: [tenant_id, roles, status]
          properties:
            tenant_id: { type: string, format: uuid }
            roles:
              type: array
              items: { $ref: '#/components/schemas/Role' }
            status: { type: string, enum: [ACTIVE] }
    Ref:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ManagerRef:
      type: object
      required: [id, full_name]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
    CurrentOrg:
      type: object
      description: department/position/valid_from are null when only a manager is set (no placement yet).
      required: [department, position, manager, valid_from]
      properties:
        department:
          oneOf:
            - $ref: '#/components/schemas/Ref'
            - type: 'null'
        position:
          oneOf:
            - $ref: '#/components/schemas/Ref'
            - type: 'null'
        manager:
          oneOf:
            - $ref: '#/components/schemas/ManagerRef'
            - type: 'null'
        valid_from: { type: [string, 'null'], format: date }
    OrgInput:
      type: object
      additionalProperties: false
      required: [department_id, position_id]
      properties:
        department_id: { type: string, format: uuid }
        position_id: { type: string, format: uuid }
        manager_employee_id: { type: [string, 'null'], format: uuid, description: Current manager (null = none). }
    OrgAssignmentRequest:
      type: object
      additionalProperties: false
      required: [valid_from, department_id, position_id]
      properties:
        valid_from: { type: string, format: date, description: Not before hire_date. }
        department_id: { type: string, format: uuid }
        position_id: { type: string, format: uuid }
        manager_employee_id: { type: [string, 'null'], format: uuid }
    OrgAssignment:
      type: object
      required: [id, valid_from, valid_to, department, position, manager]
      properties:
        id: { type: string, format: uuid }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, 'null'], format: date }
        department: { $ref: '#/components/schemas/Ref' }
        position: { $ref: '#/components/schemas/Ref' }
        manager:
          oneOf:
            - $ref: '#/components/schemas/ManagerRef'
            - type: 'null'
    Holiday:
      type: object
      required: [id, date, name, version]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        name: { type: string }
        version: { type: integer, format: int32 }
    HolidayList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 366
          items: { $ref: '#/components/schemas/Holiday' }
    HolidayCreate:
      type: object
      additionalProperties: false
      required: [date, name]
      properties:
        date: { type: string, format: date }
        name: { type: string, minLength: 1, maxLength: 100 }
    ComponentDefinition:
      type: object
      required: [id, code, name, category, stage, calc_type, default_amount, rate, ruleset_ref, base_ref, day_source,
                 cap_min, cap_max, taxable, bpjs_base, rounding, is_system, status, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [EARNING, DEDUCTION] }
        stage: { type: string, enum: [EARNING, OVERTIME, ABSENCE, STATUTORY, TAX, ADJUSTMENT] }
        calc_type: { type: string, enum: [FIXED, PERCENT_OF, PER_DAY, PER_HOUR_MULTIPLIER] }
        default_amount: { type: [string, 'null'] }
        rate: { type: [string, 'null'] }
        ruleset_ref: { type: [string, 'null'] }
        base_ref: { type: [string, 'null'] }
        day_source: { type: [string, 'null'], enum: [PRESENT, WORKING, null] }
        cap_min: { type: [string, 'null'] }
        cap_max: { type: [string, 'null'] }
        taxable: { type: boolean }
        bpjs_base: { type: boolean }
        rounding: { type: string, enum: [HALF_UP, DOWN, UP] }
        is_system: { type: boolean }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        version: { type: integer, format: int32 }
    ComponentDefinitionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ComponentDefinition' }
    ComponentDefinitionCreate:
      type: object
      additionalProperties: false
      description: Tenant components are always stage EARNING; PER_HOUR_MULTIPLIER is system-only.
      required: [code, name, category, calc_type]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        category: { type: string, enum: [EARNING, DEDUCTION] }
        calc_type: { type: string, enum: [FIXED, PERCENT_OF, PER_DAY] }
        default_amount: { $ref: '#/components/schemas/Money' }
        rate: { type: string, description: '0..1, up to 6 fraction digits' }
        base_ref: { type: string, description: 'BASE_SALARY, FIXED_ALLOWANCES, or the code of an earlier component' }
        day_source: { type: string, enum: [PRESENT, WORKING] }
        cap_min: { $ref: '#/components/schemas/Money' }
        cap_max: { $ref: '#/components/schemas/Money' }
        taxable: { type: boolean, default: true }
        bpjs_base: { type: boolean, default: false }
        rounding: { type: string, enum: [HALF_UP, DOWN, UP], default: HALF_UP }
    ComponentDefinitionUpdate:
      type: object
      additionalProperties: false
      description: "`code`, `category`, `calc_type` are immutable; on system components only `name` may change."
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        default_amount: { $ref: '#/components/schemas/Money' }
        rate: { type: string }
        base_ref: { type: string }
        cap_min: { $ref: '#/components/schemas/Money' }
        cap_max: { $ref: '#/components/schemas/Money' }
        taxable: { type: boolean }
        bpjs_base: { type: boolean }
        rounding: { type: string, enum: [HALF_UP, DOWN, UP] }
    SalaryAssignment:
      type: object
      required: [id, employee_id, base_salary, valid_from, valid_to, change_reason, created_by, created_at]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        base_salary: { $ref: '#/components/schemas/Money' }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, 'null'], format: date, description: Exclusive (half-open). }
        change_reason: { type: [string, 'null'] }
        created_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    SalaryChangeRequest:
      type: object
      additionalProperties: false
      required: [base_salary, valid_from]
      properties:
        base_salary: { $ref: '#/components/schemas/Money' }
        valid_from: { type: string, format: date, description: 'Not before hire_date, at most 366 days ahead.' }
        change_reason: { type: string, maxLength: 200 }
    ComponentRef:
      type: object
      required: [id, code, name, calc_type]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        calc_type: { type: string }
    EmployeeComponent:
      type: object
      required: [id, employee_id, component, amount, rate, valid_from, valid_to]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        component: { $ref: '#/components/schemas/ComponentRef' }
        amount: { type: [string, 'null'] }
        rate: { type: [string, 'null'] }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, 'null'], format: date }
    ComponentAssignmentRequest:
      type: object
      additionalProperties: false
      required: [component_id, valid_from]
      properties:
        component_id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        rate: { type: string }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
    SalaryHistory:
      type: object
      required: [salary, components]
      properties:
        salary:
          type: array
          items: { $ref: '#/components/schemas/SalaryAssignment' }
        components:
          type: array
          items: { $ref: '#/components/schemas/EmployeeComponent' }
    PayrollRunStatus:
      type: string
      enum: [DRAFT, CALCULATING, CALCULATED, PENDING_APPROVAL, APPROVED, FINALIZED, FAILED, CANCELLED]
    CreatePayrollRunRequest:
      type: object
      additionalProperties: false
      required: [period]
      properties:
        period:
          allOf: [{ $ref: '#/components/schemas/Period' }]
          description: At most one month ahead of the current month (tenant timezone).
    PayrollRunTotals:
      type: object
      required: [gross, deductions, net]
      properties:
        gross: { $ref: '#/components/schemas/Money' }
        deductions: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
    RulesetRef:
      type: object
      required: [code, version]
      properties:
        code: { type: string, examples: [ID-SIMPLIFIED] }
        version: { type: string, examples: ['2026.1'] }
    PayrollRun:
      type: object
      description: >
        Run of one period (docs/design/16-api-endpoints.md §16, amendment S4). `totals`, `ruleset` and the
        `counts` values are null until the run is CALCULATED. Approval fields (`approval_request_id`,
        `stale`, `submitted_by`, …) arrive with Sprint 5.
      required: [id, period, status, calc_version, progress, totals, counts, ruleset, failure_reason, created_by,
                 created_at, calc_started_at, calculated_at, cancel_reason]
      properties:
        id: { type: string, format: uuid }
        period: { $ref: '#/components/schemas/Period' }
        status: { $ref: '#/components/schemas/PayrollRunStatus' }
        calc_version: { type: integer, format: int32, description: 0 until the first calculate; + 1 per (re)calculation. }
        progress:
          type: object
          required: [chunks_done, chunks_total, eligible_count]
          properties:
            chunks_done: { type: integer, format: int32 }
            chunks_total: { type: integer, format: int32 }
            eligible_count: { type: [integer, 'null'], format: int32 }
        totals:
          oneOf:
            - $ref: '#/components/schemas/PayrollRunTotals'
            - type: 'null'
        counts:
          type: object
          required: [ok, error, excluded, warnings]
          properties:
            ok: { type: [integer, 'null'], format: int32 }
            error: { type: [integer, 'null'], format: int32 }
            excluded: { type: [integer, 'null'], format: int32 }
            warnings: { type: [integer, 'null'], format: int32 }
        ruleset:
          oneOf:
            - $ref: '#/components/schemas/RulesetRef'
            - type: 'null'
        failure_reason: { type: [string, 'null'], description: Set when a job failed permanently (FAILED). }
        created_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        calc_started_at: { type: [string, 'null'], format: date-time }
        calculated_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'] }
    PayrollRunListItem:
      type: object
      required: [id, period, status, calc_version, total_net, created_at]
      properties:
        id: { type: string, format: uuid }
        period: { $ref: '#/components/schemas/Period' }
        status: { $ref: '#/components/schemas/PayrollRunStatus' }
        calc_version: { type: integer, format: int32 }
        total_net: { type: [string, 'null'], pattern: '^-?[0-9]{1,16}\.[0-9]{2}$' }
        created_at: { type: string, format: date-time }
    PayrollRunList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/PayrollRunListItem' }
        page: { $ref: '#/components/schemas/Page' }
    PayrollItem:
      type: object
      description: >
        One employee in a run. `employee_no`, `employee_name` and `department_id` are denormalized at
        calculation time (R3-4), so historical runs keep the values they were paid with. Amounts are null
        for ERROR items.
      required: [id, employee_id, employee_no, employee_name, department_id, status, gross, deductions, net,
                 error_codes, warning_codes, excluded_reason]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        employee_no: { type: string }
        employee_name: { type: string }
        department_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [OK, ERROR, EXCLUDED] }
        gross: { type: [string, 'null'], pattern: '^-?[0-9]{1,16}\.[0-9]{2}$' }
        deductions: { type: [string, 'null'], pattern: '^-?[0-9]{1,16}\.[0-9]{2}$' }
        net: { type: [string, 'null'], pattern: '^-?[0-9]{1,16}\.[0-9]{2}$' }
        error_codes:
          type: array
          items: { type: string, examples: [NO_SALARY] }
        warning_codes:
          type: array
          items: { type: string }
        excluded_reason: { type: [string, 'null'] }
    PayrollItemList:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/PayrollItem' }
        page: { $ref: '#/components/schemas/Page' }
    PayrollLine:
      type: object
      required: [sort_order, code, name, category, stage, amount, basis, explanation, taxable, rounding]
      properties:
        sort_order: { type: integer, format: int32 }
        code: { type: string, examples: [BASE_SALARY] }
        name: { type: string }
        category: { type: string, enum: [EARNING, DEDUCTION] }
        stage: { type: string, enum: [EARNING, OVERTIME, ABSENCE, STATUTORY, TAX, ADJUSTMENT] }
        amount: { $ref: '#/components/schemas/Money' }
        basis:
          type: object
          additionalProperties: true
          description: Inputs of this line (days, rates, bases) as decimal strings.
        explanation: { type: string }
        taxable: { type: boolean }
        rounding: { type: string, enum: [HALF_UP, DOWN, UP] }
    PayrollIssue:
      type: object
      required: [kind, code, detail]
      properties:
        kind: { type: string, enum: [error, warning] }
        code: { type: string }
        detail: { type: string }
    PayrollItemDetail:
      type: object
      description: "`PayrollItem` + `calc_version`, `lines` and `issues`."
      required: [id, employee_id, employee_no, employee_name, department_id, status, gross, deductions, net,
                 error_codes, warning_codes, excluded_reason, calc_version, lines, issues]
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        employee_no: { type: string }
        employee_name: { type: string }
        department_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [OK, ERROR, EXCLUDED] }
        gross: { type: [string, 'null'], pattern: '^-?[0-9]{1,16}\.[0-9]{2}$' }
        deductions: { type: [string, 'null'], pattern: '^-?[0-9]{1,16}\.[0-9]{2}$' }
        net: { type: [string, 'null'], pattern: '^-?[0-9]{1,16}\.[0-9]{2}$' }
        error_codes:
          type: array
          items: { type: string }
        warning_codes:
          type: array
          items: { type: string }
        excluded_reason: { type: [string, 'null'] }
        calc_version: { type: integer, format: int32 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PayrollLine' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/PayrollIssue' }
    ExcludePayrollItemRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 500 }
    CancelPayrollRunRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    Problem:
      type: object
      description: RFC 9457 Problem Details with a stable machine-readable code.
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, examples: [RUN_STALE] }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          description: Field-level errors, only for VALIDATION_ERROR.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        existing_resource_id:
          type: string
          format: uuid
          description: ACTIVE_RUN_EXISTS and IMPORT_DUPLICATE — the resource that already exists.
  responses:
    ValidationError:
      description: VALIDATION_ERROR (including an unknown `tenant_id` body field), MALFORMED_JSON, INVALID_CURSOR, IDEMPOTENCY_KEY_REQUIRED, or IDEMPOTENCY_KEY_INVALID.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: UNAUTHENTICATED, TOKEN_EXPIRED, INVALID_CREDENTIALS, or REFRESH_TOKEN_REUSED.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: FORBIDDEN — no tenant selected (token without tid), missing role, or failed CSRF guard.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: NOT_FOUND — the resource does not exist, belongs to another tenant, or must not be known to the caller.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Domain conflicts from the catalogue, e.g. ACTIVE_RUN_EXISTS, APPROVAL_ALREADY_DECIDED, VERSION_CONFLICT, RUN_FINALIZED, PERIOD_LOCKED, LAST_OWNER, REQUEST_IN_PROGRESS.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Business rule violations from the catalogue, e.g. RUN_STALE, RUN_HAS_ERRORS, SELF_APPROVAL_FORBIDDEN, OVERLAPPING_PERIOD, INSUFFICIENT_LEAVE_BALANCE, IDEMPOTENCY_KEY_REUSED.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: EMAIL_VERIFICATION_INVALID or INVITATION_INVALID (one code for expired, used, and unknown tokens).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE (dependency down, e.g. the mail server); retry with backoff.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: RATE_LIMITED — see Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
