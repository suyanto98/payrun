# Matriks otorisasi PayRun sebagai DATA (docs/design/17-api-authorization-matrix.md §2, §4).
# Dokumen dan test berasal dari sumber yang sama: internal/app/authz_matrix_test.go membaca file ini.
#
# Aturan CI (file 17 §4.4):
#   1. setiap rute di router (chi.Walk) wajib punya baris di sini, dan sebaliknya;
#   2. setiap baris `access: tenant` wajib punya minimal satu case.
#
# Kolom:
#   access  public | cookie | user (Bearer tanpa `tid`) | tenant (Bearer dengan `tid`)
#   audit   action audit_log yang wajib bertambah tepat 1 untuk setiap respons 2xx
#   cases   target    : resource untuk {id}. Endpoint yang mengubah data mendapat resource BARU per
#                       aktor (supaya If-Match "1" dan state awal selalu sama):
#                         department | position  → dibuat OWNER
#                         employee_other         → employee tidak tertaut ke user mana pun
#                         employee_self          → employee fixture yang tertaut ke user EMPLOYEE (baca saja)
#                         employee_report        → employee yang sama: bawahan langsung user MANAGER (S3)
#                         holiday | component    → libur / komponen tenant (FIXED) yang dibuat OWNER
#                         member_plain           → member ACTIVE baru dengan role EMPLOYEE
#                         member_admin           → member ACTIVE baru dengan role PAYROLL_ADMIN
#                         attendance_other/_self → catatan absensi INCOMPLETE milik empOther / empSelf
#                         leave_own / overtime_own → cuti / lembur PENDING milik EMPLOYEE
#                         approval_leave         → approval cuti EMPLOYEE (approver = MANAGER)
#                         run_calculated         → run CALCULATED tanpa item ERROR (periode lampau)
#                         run_approved           → run APPROVED (submit PAYROLL_ADMIN, approve OWNER)
#                         approval_run           → approval PAYROLL_RUN, requester PAYROLL_ADMIN, approver OWNER
#                         run                    → payroll run DRAFT (periode 2025 ke bawah, unik per run)
#                         run_item               → run CALCULATED (2026) + satu item ERROR ({item_id})
#           query     : query string (tanpa "?")
#           body      : JSON; placeholder {n} = nomor unik, {nik} = NIK 16 digit unik, {email} = email unik,
#                       {date} = tanggal unik, {period} = periode payroll unik (YYYY-MM),
#                       {dept}/{pos}/{comp} = departemen/posisi/komponen fixture,
#                       {owner_user}/{payroll_user} = user OWNER / PAYROLL_ADMIN fixture,
#                       {workday}/{ot_date}/{ot_start}/{ot_end} = hari kerja unik 2027 (sama dalam satu body),
#                       {leave_annual} = jenis cuti ANNUAL
#           if_match  : kirim If-Match: "1"
#           idempotency: kirim Idempotency-Key acak
#           expect    : status per role (O H P M E); role yang tidak disebut tidak diuji di case itu
#
# Lintas tenant (file 17 §4.3) dibangkitkan otomatis dari baris tenant ber-{id}: aktor Beta memanggil
# id milik Alpha. Role yang diizinkan endpoint wajib mendapat 404; role yang ditolak endpoint boleh
# 403 (penolakan tingkat aksi, tidak bergantung pada id, jadi tidak membocorkan keberadaan) atau 404.

routes:
  # ---------------------------------------------------------------- auth & session (S1)
  - {id: A1, route: "POST /auth/login", access: public}
  - {id: A2, route: "POST /auth/refresh", access: cookie}
  - {id: A3, route: "POST /auth/logout", access: cookie}
  - {id: A4, route: "GET /me", access: user}
  - {id: A5, route: "GET /me/memberships", access: user}
  - {id: A6, route: "POST /session/switch-tenant", access: user}
  - {id: A7, route: "POST /auth/verify-email", access: public}
  - {id: A8, route: "POST /auth/resend-verification", access: user}
  - {id: T1, route: "POST /tenants/signup", access: public}

  - id: T2
    route: "GET /tenant"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 200, E: 200}

  # ---------------------------------------------------------------- libur (S3)
  - id: T4
    route: "GET /holidays"
    access: tenant
    cases:
      - {query: "year=2026", expect: {O: 200, H: 200, P: 200, M: 200, E: 200}}
  - id: T5
    route: "POST /holidays"
    access: tenant
    audit: holiday.created
    cases:
      - body: {date: "{date}", name: "Cuti bersama"}
        expect: {O: 201, H: 201, P: 403, M: 403, E: 403}
  - id: T6
    route: "DELETE /holidays/{id}"
    access: tenant
    audit: holiday.deleted
    cases:
      - {target: holiday, expect: {O: 204, H: 204, P: 403, M: 403, E: 403}}

  # ---------------------------------------------------------------- members (U1–U3 S2; U4/U5 S4)
  - id: U1
    route: "GET /members"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 403, M: 403, E: 403}

  - id: U2
    route: "POST /invitations"
    access: tenant
    audit: membership.invited
    cases:
      - body: {email: "{email}", roles: [EMPLOYEE]}
        expect: {O: 201, H: 201, P: 403, M: 403, E: 403}
      - body: {email: "{email}", roles: [PAYROLL_ADMIN]}
        expect: {O: 201, H: 403}

  - {id: U3, route: "POST /invitations/accept", access: user}
  - id: U4
    route: "PATCH /members/{id}/roles"
    access: tenant
    audit: membership.roles_changed
    cases:
      - {target: member_plain, if_match: true, body: {roles: [MANAGER, EMPLOYEE]}, expect: {O: 200, H: 200, P: 403, M: 403, E: 403}}
      - {target: member_plain, if_match: true, body: {roles: [PAYROLL_ADMIN]}, expect: {O: 200, H: 403}}   # HR tidak memberi role admin
      - {target: member_admin, if_match: true, body: {roles: [EMPLOYEE]}, expect: {O: 200, H: 403}}       # HR tidak menyentuh admin
  - id: U5
    route: "POST /members/{id}/revoke"
    access: tenant
    audit: membership.revoked
    cases:
      - {target: member_plain, body: {reason: Resign}, expect: {O: 200, H: 200, P: 403, M: 403, E: 403}}
      - {target: member_admin, body: {reason: Resign}, expect: {O: 200, H: 403}}

  # ---------------------------------------------------------------- organisasi (G1–G4)
  - id: G1a
    route: "GET /departments"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 200, E: 200}
  - id: G2a
    route: "POST /departments"
    access: tenant
    audit: department.created
    cases:
      - body: {code: "D{n}", name: "Baru"}
        expect: {O: 201, H: 201, P: 403, M: 403, E: 403}
  - id: G3a
    route: "PATCH /departments/{id}"
    access: tenant
    audit: department.updated
    cases:
      - {target: department, if_match: true, body: {name: "Ganti"}, expect: {O: 200, H: 200, P: 403, M: 403, E: 403}}
  - id: G4a
    route: "POST /departments/{id}/deactivate"
    access: tenant
    audit: department.deactivated
    cases:
      - {target: department, expect: {O: 200, H: 200, P: 403, M: 403, E: 403}}

  - id: G1b
    route: "GET /positions"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 200, E: 200}
  - id: G2b
    route: "POST /positions"
    access: tenant
    audit: position.created
    cases:
      - body: {code: "P{n}", name: "Baru"}
        expect: {O: 201, H: 201, P: 403, M: 403, E: 403}
  - id: G3b
    route: "PATCH /positions/{id}"
    access: tenant
    audit: position.updated
    cases:
      - {target: position, if_match: true, body: {name: "Ganti"}, expect: {O: 200, H: 200, P: 403, M: 403, E: 403}}
  - id: G4b
    route: "POST /positions/{id}/deactivate"
    access: tenant
    audit: position.deactivated
    cases:
      - {target: position, expect: {O: 200, H: 200, P: 403, M: 403, E: 403}}

  # ---------------------------------------------------------------- employees (W1–W5; W6 di S4)
  - id: W1
    route: "GET /employees"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 200, E: 403}   # M: hanya bawahan langsung
  - id: W2
    route: "POST /employees"
    access: tenant
    audit: employee.created
    cases:
      - idempotency: true
        body: {employee_no: "EMP-9{n}", full_name: "Baru", hire_date: "2026-01-05", nik: "{nik}"}
        expect: {O: 201, H: 201, P: 403, M: 403, E: 403}
  - id: W3
    route: "GET /employees/{id}"
    access: tenant
    cases:
      - {target: employee_other, expect: {O: 200, H: 200, P: 200, M: 404, E: 404}}
      - {target: employee_self, expect: {E: 200, M: 200}}   # bagi MANAGER: bawahan langsung (versi dasar)
  - id: W4
    route: "PATCH /employees/{id}"
    access: tenant
    audit: employee.updated
    cases:
      - {target: employee_other, if_match: true, body: {full_name: "Ganti"}, expect: {O: 200, H: 200, P: 403, M: 404, E: 404}}
      - {target: employee_self, if_match: true, body: {full_name: "Ganti"}, expect: {E: 403, M: 403}}
  - id: W5
    route: "POST /employees/{id}/terminate"
    access: tenant
    audit: employee.terminated
    cases:
      - {target: employee_other, if_match: true, body: {type: RESIGNED, end_date: "2026-03-20"}, expect: {O: 200, H: 200, P: 403, M: 404, E: 404}}
      - {target: employee_self, if_match: true, body: {type: RESIGNED, end_date: "2026-03-20"}, expect: {E: 403, M: 403}}
  - id: W6
    route: "GET /employees/{id}/pii"
    access: tenant
    audit: employee.pii_viewed   # SETIAP 200 (T-PR-10)
    cases:
      - {target: employee_other, expect: {O: 200, H: 200, P: 403, M: 404, E: 404}}
      - {target: employee_self, expect: {E: 200, M: 403}}   # diri sendiri boleh; MANAGER atas bawahan → 403

  # ---------------------------------------------------------------- org assignment, gaji, komponen (S3)
  - id: W7
    route: "POST /employees/{id}/org-assignments"
    access: tenant
    audit: employee.org_assigned
    cases:
      - target: employee_other
        idempotency: true
        body: {valid_from: "2026-02-01", department_id: "{dept}", position_id: "{pos}"}
        expect: {O: 201, H: 201, P: 403, M: 404, E: 404}
      - target: employee_report
        idempotency: true
        body: {valid_from: "2026-02-01", department_id: "{dept}", position_id: "{pos}"}
        expect: {M: 403, E: 403}
  - id: W8
    route: "GET /employees/{id}/salary-history"
    access: tenant
    cases:
      - {target: employee_other, expect: {O: 200, H: 200, P: 200, M: 404, E: 404}}
      - {target: employee_self, expect: {E: 200, M: 404}}   # MANAGER tidak melihat gaji bawahan (file 17 §3.4)
  - id: W9
    route: "POST /employees/{id}/salary-changes"
    access: tenant
    audit: salary.changed
    cases:
      - target: employee_other
        idempotency: true
        body: {base_salary: "6000000.00", valid_from: "2026-02-01", change_reason: "Kenaikan"}
        expect: {O: 201, H: 201, P: 403, M: 404, E: 404}   # PAYROLL_ADMIN tidak mengubah gaji (SoD, file 17 §3.1)
      - target: employee_report
        idempotency: true
        body: {base_salary: "6000000.00", valid_from: "2026-02-01"}
        expect: {M: 403, E: 403}
  - id: W10
    route: "POST /employees/{id}/component-assignments"
    access: tenant
    audit: component.assigned
    cases:
      - target: employee_other
        idempotency: true
        body: {component_id: "{comp}", amount: "750000.00", valid_from: "2026-02-01"}
        expect: {O: 201, H: 201, P: 403, M: 404, E: 404}
      - target: employee_report
        idempotency: true
        body: {component_id: "{comp}", valid_from: "2026-02-01"}
        expect: {M: 403, E: 403}

  # ---------------------------------------------------------------- komponen gaji (C1–C4, S3)
  - id: C1
    route: "GET /component-definitions"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 403, E: 403}
  - id: C2
    route: "POST /component-definitions"
    access: tenant
    audit: component.created
    cases:
      - body: {code: "K{n}", name: "Komponen", category: EARNING, calc_type: FIXED, default_amount: "100000.00"}
        expect: {O: 201, H: 201, P: 403, M: 403, E: 403}
  - id: C3
    route: "PATCH /component-definitions/{id}"
    access: tenant
    audit: component.updated
    cases:
      - {target: component, if_match: true, body: {name: "Ganti"}, expect: {O: 200, H: 200, P: 403, M: 403, E: 403}}
  - id: C4
    route: "POST /component-definitions/{id}/deactivate"
    access: tenant
    audit: component.deactivated
    cases:
      - {target: component, expect: {O: 200, H: 200, P: 403, M: 403, E: 403}}

  # ---------------------------------------------------------------- payroll run (Y2–Y8, Y12; S4)
  # Run: OWNER/PAYROLL_ADMIN menjalankan, HR_ADMIN membaca (ᴬ). Bagi MANAGER/EMPLOYEE resource run
  # tidak terlihat → 404; koleksi → 403. Y1 (GET /payroll-periods) belum ada rutenya.
  - id: Y2
    route: "POST /payroll-runs"
    access: tenant
    audit: payroll_run.created
    cases:
      - {idempotency: true, body: {period: "{period}"}, expect: {O: 201, H: 403, P: 201, M: 403, E: 403}}
  - id: Y3
    route: "GET /payroll-runs"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 403, E: 403}
  - id: Y4
    route: "GET /payroll-runs/{id}"
    access: tenant
    cases:
      - {target: run, expect: {O: 200, H: 200, P: 200, M: 404, E: 404}}
  - id: Y5
    route: "POST /payroll-runs/{id}/calculate"
    access: tenant
    audit: payroll_run.calculate_requested
    cases:
      - {target: run, idempotency: true, expect: {O: 202, H: 403, P: 202, M: 404, E: 404}}
  - id: Y6
    route: "GET /payroll-runs/{id}/items"
    access: tenant
    audit: payroll.bulk_read   # SETIAP request, semua role (final review R2-6)
    cases:
      - {target: run_item, expect: {O: 200, H: 200, P: 200, M: 404, E: 404}}
  - id: Y6s
    route: "GET /payroll-runs/{id}/summary"
    access: tenant
    audit: payroll.bulk_read   # total departemen kecil = gaji perorangan: diperlakukan seperti Y6
    cases:
      - {target: run_item, expect: {O: 200, H: 200, P: 200, M: 404, E: 404}}
  - id: Y7
    route: "GET /payroll-runs/{id}/items/{item_id}"
    access: tenant
    cases:   # audit payroll_item.read hanya untuk HR_ADMIN (ᴬ), diuji di payroll_test.go
      - {target: run_item, expect: {O: 200, H: 200, P: 200, M: 404, E: 404}}
  - id: Y8
    route: "POST /payroll-runs/{id}/items/{item_id}/exclude"
    access: tenant
    audit: payroll_item.excluded
    cases:
      - {target: run_item, body: {reason: "Data gaji belum lengkap"}, expect: {O: 200, H: 403, P: 200, M: 404, E: 404}}
  - id: Y10
    route: "POST /payroll-runs/{id}/submit"
    access: tenant
    audit: payroll_run.submitted
    cases:   # approver eksplisit (tenant matriks punya beberapa admin); memilih diri sendiri → 403
      - {target: run_calculated, body: {approver_user_id: "{owner_user}"}, expect: {O: 403, H: 403, P: 200, M: 404, E: 404}}
      - {target: run_calculated, body: {approver_user_id: "{payroll_user}"}, expect: {O: 200, P: 403}}
  - id: Y11
    route: "POST /payroll-runs/{id}/finalize"
    access: tenant
    audit: payroll_run.finalized
    cases:
      - {target: run_approved, idempotency: true, expect: {O: 200, H: 403, P: 200, M: 404, E: 404}}
  - id: Y12
    route: "POST /payroll-runs/{id}/cancel"
    access: tenant
    audit: payroll_run.cancelled
    cases:
      - {target: run, body: {reason: "Salah periode"}, expect: {O: 200, H: 403, P: 200, M: 404, E: 404}}

  # ---------------------------------------------------------------- approvals (R1–R3, S5)
  # Otorisasi per approval: hanya approver yang di-snapshot; requester → 403 SELF_APPROVAL_FORBIDDEN;
  # lainnya 404. Override HR untuk cuti/lembur menyusul S6.
  - id: R1
    route: "GET /approvals/inbox"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 200, E: 200}
  - id: R2
    route: "POST /approvals/{id}/approve"
    access: tenant
    audit: approval.approved
    cases:
      - {target: approval_run, expect: {O: 200, H: 404, P: 403, M: 404, E: 404}}
      - {target: approval_leave, expect: {M: 200, E: 403, H: 200, O: 404, P: 404}}   # cuti EMPLOYEE → atasan langsung; HR override
  - id: R3
    route: "POST /approvals/{id}/reject"
    access: tenant
    audit: approval.rejected
    cases:
      - {target: approval_run, body: {note: "Data lembur belum lengkap"}, expect: {O: 200, H: 404, P: 403, M: 404, E: 404}}
      - {target: approval_leave, body: {note: "Bentrok jadwal"}, expect: {M: 200, E: 403, H: 200, O: 404, P: 404}}

  # ---------------------------------------------------------------- absensi (D1–D4, S6)
  # 👤 = untuk diri sendiri, role apa pun yang tertaut ke employee. Di fixture hanya EMPLOYEE dan MANAGER
  # yang tertaut; OWNER/HR_ADMIN/PAYROLL_ADMIN tanpa employee → 422 EMPLOYEE_NOT_ACTIVE (file 17).
  - id: D1
    route: "POST /attendance/clock-in"
    access: tenant
    cases:
      - expect: {O: 422, H: 422, P: 422, M: 201, E: 201}
  - id: D2
    route: "POST /attendance/clock-out"
    access: tenant
    cases:
      - expect: {O: 422, H: 422, P: 422, M: 200, E: 200}
  - id: D3
    route: "GET /attendance"
    access: tenant
    cases:   # MANAGER/EMPLOYEE: hasil dibatasi scope
      - {query: "period=2026-10", expect: {O: 200, H: 200, P: 200, M: 200, E: 200}}
  - id: D4
    route: "PATCH /attendance/{id}"
    access: tenant
    audit: attendance.corrected
    cases:
      - {target: attendance_other, if_match: true, body: {clock_out_at: "2026-01-01T09:00:00Z", correction_reason: "Lupa clock out"}, expect: {O: 200, H: 200, P: 403, M: 404, E: 404}}
      - {target: attendance_self, if_match: true, body: {clock_out_at: "2026-01-01T09:00:00Z", correction_reason: "Lupa clock out"}, expect: {M: 403, E: 403}}

  # ---------------------------------------------------------------- cuti (L1–L5, S6)
  - id: L1
    route: "GET /leave-types"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 200, E: 200}
  - id: L2
    route: "GET /me/leave-balances"
    access: tenant
    cases:
      - {query: "year=2027", expect: {O: 422, H: 422, P: 422, M: 200, E: 200}}
  - id: L3
    route: "POST /leave-requests"
    access: tenant
    audit: leave.requested
    cases:
      - idempotency: true
        body: {leave_type_id: "{leave_annual}", start_date: "{workday}", end_date: "{workday}", reason: "Urusan keluarga"}
        expect: {O: 422, H: 422, P: 422, M: 201, E: 201}
  - id: L4
    route: "POST /leave-requests/{id}/cancel"
    access: tenant
    audit: leave.cancelled
    cases:   # hanya pengaju (EMPLOYEE); orang lain → 404
      - {target: leave_own, expect: {E: 200, O: 404, H: 404, P: 404, M: 404}}
  - id: L5
    route: "GET /leave-requests"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 200, E: 200}

  # ---------------------------------------------------------------- lembur (V1–V3, S6)
  - id: V1
    route: "POST /overtime-requests"
    access: tenant
    audit: overtime.requested
    cases:
      - idempotency: true
        body: {work_date: "{ot_date}", start_at: "{ot_start}", end_at: "{ot_end}", reason: "Stok opname"}
        expect: {O: 422, H: 422, P: 422, M: 201, E: 201}
  - id: V2
    route: "POST /overtime-requests/{id}/cancel"
    access: tenant
    audit: overtime.cancelled
    cases:
      - {target: overtime_own, expect: {E: 200, O: 404, H: 404, P: 404, M: 404}}
  - id: V3
    route: "GET /overtime-requests"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 200, E: 200}

  # ---------------------------------------------------------------- adjustments (J1–J3, S7)
  - id: J1
    route: "POST /adjustments"
    access: tenant
    audit: adjustment.created
    cases:
      - idempotency: true
        body: {employee_id: "{emp_other}", origin_period: "{adj_origin}", target_period: "2026-12", component_code: "MANUAL", amount: "1000.00", reason: "Koreksi"}
        expect: {O: 201, H: 201, P: 201, M: 403, E: 403}
  - id: J2
    route: "GET /adjustments"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 403, E: 403}
  - id: J3
    route: "POST /adjustments/{id}/cancel"
    access: tenant
    audit: adjustment.cancelled
    cases:
      - {target: adjustment, body: {reason: "Salah input"}, expect: {O: 200, H: 200, P: 200, M: 404, E: 404}}

  # ---------------------------------------------------------------- payslips (S1–S5, S7, PI-17)
  # 👤 pemilik (EMPLOYEE = empSelf) tanpa audit; OWNER/HR/PAYROLL ter-audit setiap akses (ᴬ); lainnya 404.
  - id: S1
    route: "GET /me/payslips"
    access: tenant
    cases:
      - expect: {O: 200, H: 200, P: 200, M: 200, E: 200}
  - id: S2
    route: "GET /me/payslips/{id}"
    access: tenant
    cases:
      - {target: payslip_self, expect: {E: 200, O: 404, H: 404, P: 404, M: 404}}
  - id: S3
    route: "GET /payslips"
    access: tenant
    audit: payroll.bulk_read
    cases:
      - {query: "run_id={payslip_run}", expect: {O: 200, H: 200, P: 200, M: 403, E: 403}}
  - id: S4
    route: "GET /payslips/{id}"
    access: tenant
    audit: payslip.viewed_by_admin
    cases:
      - {target: payslip_self, expect: {O: 200, H: 200, P: 200, M: 404, E: 404}}
  - id: S5
    route: "GET /payslips/{id}/download"
    access: tenant
    audit: payslip.downloaded
    cases:
      - {target: payslip_self, no_audit: [E], expect: {O: 200, H: 200, P: 200, M: 404, E: 200}}
